services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_ashen_era
    restart: always
    ports:
      - "6333:6333"  # HTTP REST API & Web Dashboard UI
      - "6334:6334"  # gRPC API
    volumes:
      - ./data/local_qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
